name: Daily Horizon Summary

on:
  schedule:
    - cron: '30 0 * * *'  # UTC 0:30 = 北京时间 8:30
  push:
    branches: [main]       # 推 main 时自动触发,便于调试
  workflow_dispatch:      # 手动触发

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv sync

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Check webhook env var
        env:
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: |
          echo "HORIZON_WEBHOOK_URL length: ${#HORIZON_WEBHOOK_URL}"
          if [ -z "$HORIZON_WEBHOOK_URL" ]; then
            echo "::warning::HORIZON_WEBHOOK_URL is EMPTY - no push will be sent!"
          else
            echo "::notice::HORIZON_WEBHOOK_URL is set"
          fi

      - name: Test webhook URL (curl)
        env:
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: |
          echo "发送测试消息到企微..."
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"msgtype":"markdown","markdown":{"content":"**GHA 连接测试** 来自 GitHub Actions 运行环境"}}' \
            "$HORIZON_WEBHOOK_URL" 2>&1)
          echo "curl exit code: $?"
          echo "HTTP response: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "::notice::Webhook 测试通过 (HTTP 200)"
          else
            echo "::warning::Webhook 测试返回 HTTP $HTTP_CODE - 推送可能失败!"
          fi

      - name: Run Horizon
        env:
          # AI API Keys (DeepSeek 推荐)
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub Token (提高 API 速率限制, Secret 名不能以 GITHUB_ 开头)
          GH_PAT: ${{ secrets.GH_PAT }}
          # Webhook 推送 (企业微信/飞书/钉钉等)
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 24

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./docs
          keep_files: true
          commit_message: "📝 AI日报: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: true
