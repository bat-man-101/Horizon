name: Daily Horizon Summary

on:
  schedule:
    - cron: '30 23 * * *'  # UTC 23:30 = 北京时间 7:30 (GHA ~1h延迟,实际约8:30运行)
  workflow_dispatch:      # 手动触发

jobs:
  daily-summary:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: |
          uv sync
          pip install deep-translator -q

      - name: Prepare GitHub Actions config
        run: cp data/config.github.json data/config.json

      - name: Run Horizon
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          HORIZON_WEBHOOK_URL: ${{ secrets.HORIZON_WEBHOOK_URL }}
        run: uv run horizon --hours 24

      - name: Convert markdown to standalone HTML
        run: |
          pip install markdown -q
          python .github/workflows/build_static.py

      - name: Machine translate HTML to Chinese
        run: |
          pip install deep-translator -q
          python .github/workflows/translate_html.py

      - name: Set current date as environment variable
        run: echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_ENV

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ github.token }}
          publish_dir: ./docs
          commit_message: "📝 AI日报: ${{ env.DATE }}"
          publish_branch: gh-pages
          enable_jekyll: false

      # 推模式：构建完直接把 HTML POST 进 NAS（经 Cloudflare 隧道），
      # 不再让 NAS 去拉被 GFW 阻断的 github.io。需仓库 Secret: HORIZON_UPLOAD_TOKEN
      # 修复：原版 curl -f 遇任何非 2xx 都会以退出码 22 失败且不输出状态码/响应体，
      #   无法判断是密钥错(401/403)、路径错(404)还是服务端(5xx)。
      #   现打印真实 HTTP 状态码与响应体 + 失败重试，且 continue-on-error 不拖垮核心日报任务。
      - name: Push to NAS (ymeet.store) via Cloudflare Tunnel
        if: ${{ env.HORIZON_UPLOAD_TOKEN != '' }}
        continue-on-error: true  # 上云失败不应拖垮日报主任务（无人值守约定），错误仍以 ::error:: 展示
        env:
          HORIZON_UPLOAD_TOKEN: ${{ secrets.HORIZON_UPLOAD_TOKEN }}
        run: |
          set -u
          F=$(ls docs/*/*/*/summary-zh.html 2>/dev/null | head -1)
          if [ -z "$F" ]; then echo "::error::summary-zh.html not found in docs/"; exit 1; fi
          Y=$(echo "$F" | cut -d/ -f2)
          M=$(echo "$F" | cut -d/ -f3)
          D=$(echo "$F" | cut -d/ -f4)
          URL="https://ymeet.store/horizon-upload/$Y/$M/$D/summary-zh.html"
          echo "Pushing $F -> $URL"
          # 抓取真实 HTTP 状态码与响应体，便于区分 401/403(密钥) / 404(路径) / 5xx(服务端)
          HTTP_CODE=$(curl -sS -o /tmp/nas_resp.txt -w '%{http_code}' \
            --max-time 60 --retry 3 --retry-delay 5 --retry-connrefused \
            -X POST -H "X-Token: $HORIZON_UPLOAD_TOKEN" \
            --data-binary "@$F" "$URL") || true
          echo "HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ] && [ "$HTTP_CODE" != "201" ] && [ "$HTTP_CODE" != "204" ]; then
            echo "::error::NAS upload 失败，HTTP $HTTP_CODE"
            head -c 1000 /tmp/nas_resp.txt 2>/dev/null || true
            exit 22   # 语义与原退出码一致
          fi
