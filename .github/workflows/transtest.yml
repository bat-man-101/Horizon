name: Translate Probe (temporary)

on:
  workflow_dispatch:      # 手动触发，仅用于探测 runner 上各翻译接口可用性

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Probe free translation endpoints
        run: |
          set +e
          echo "===== runner egress IP ====="
          curl -s --max-time 10 https://api.ipify.org || echo "(ipify failed)"
          echo ""
          echo "===== 1) translate.googleapis.com gtx ====="
          curl -s -o /tmp/a.txt -w "http=%{http_code} time=%{time_total}\n" --max-time 20 \
            "https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=zh-CN&dt=t&q=Hello%20world"
          head -c 300 /tmp/a.txt; echo ""
          echo "===== 2) translate.google.com (deep-translator default) ====="
          curl -s -o /tmp/b.txt -w "http=%{http_code} time=%{time_total}\n" --max-time 20 \
            "https://translate.google.com/m?tl=zh-CN&sl=auto&q=Hello%20world"
          head -c 300 /tmp/b.txt; echo ""
          echo "===== 3) MyMemory (no key) ====="
          curl -s -o /tmp/c.txt -w "http=%{http_code} time=%{time_total}\n" --max-time 20 \
            "https://api.mymemory.translated.net/get?q=Hello%20world&langpair=en|zh-CN"
          head -c 300 /tmp/c.txt; echo ""
          echo "===== 4) Youdao free ====="
          curl -s -o /tmp/d.txt -w "http=%{http_code} time=%{time_total}\n" --max-time 20 \
            "https://fanyi.youdao.com/translate?&doctype=json&type=AUTO&i=Hello%20world"
          head -c 300 /tmp/d.txt; echo ""
          echo "===== 5) libretranslate public mirror1 ====="
          curl -s -o /tmp/e.txt -w "http=%{http_code} time=%{time_total}\n" --max-time 20 \
            "https://translate.plus/api/translate?source=en&target=zh&q=Hello%20world"
          head -c 200 /tmp/e.txt; echo ""
          echo "===== 6) deep_translator library ====="
          pip install deep-translator -q
          python - <<'PY'
          try:
              from deep_translator import GoogleTranslator
              t = GoogleTranslator(source="auto", target="zh-CN")
              print("deep_translator single:", repr(t.translate("Hello world")))
          except Exception as e:
              print("deep_translator single FAILED:", type(e).__name__, e)
          try:
              from deep_translator import GoogleTranslator
              t = GoogleTranslator(source="auto", target="zh-CN")
              print("deep_translator batch:", repr(t.translate_batch(["Hello world", "Good morning"])))
          except Exception as e:
              print("deep_translator batch FAILED:", type(e).__name__, e)
          PY
